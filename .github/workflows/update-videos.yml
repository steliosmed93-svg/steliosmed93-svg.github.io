name: Update top videos

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the channel feed and rank videos by views
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, xml.etree.ElementTree as ET
          url = 'https://www.youtube.com/feeds/videos.xml?channel_id=UCHJ_Yffa6Z118NwiwqiLcBw'
          ns = {'a': 'http://www.w3.org/2005/Atom', 'yt': 'http://www.youtube.com/xml/schemas/2015', 'media': 'http://search.yahoo.com/mrss/'}
          data = None
          for attempt in range(4):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  data = urllib.request.urlopen(req, timeout=30).read()
                  break
              except Exception as e:
                  print('attempt', attempt + 1, 'failed:', e)
                  time.sleep(20)
          if data is None:
              print('Feed not reachable, keeping the current list.')
              raise SystemExit(0)
          root = ET.fromstring(data)
          videos = []
          for e in root.findall('a:entry', ns):
              st = e.find('media:group/media:community/media:statistics', ns)
              link = e.find('a:link', ns).get('href', '')
              videos.append({
                  'id': e.find('yt:videoId', ns).text,
                  'title': e.find('a:title', ns).text,
                  'views': int(st.get('views')) if st is not None else 0,
                  'published': e.find('a:published', ns).text,
                  'short': '/shorts/' in link,
              })
          videos.sort(key=lambda v: v['views'], reverse=True)
          with open('videos.json', 'w', encoding='utf-8') as f:
              json.dump({'videos': videos}, f, ensure_ascii=False, indent=1)
          print(len(videos), 'videos written')
          PY
      - name: Save the list if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Update top videos" && git push)
